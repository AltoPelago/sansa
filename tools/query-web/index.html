<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SANSA Query Workbench</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>SANSA Query Workbench</h1>
        </div>
        <div class="topbar-actions">
          <select id="exampleSelect" aria-label="Example query">
            <optgroup label="Resolution">
              <option value="directExpansion">Direct expansion</option>
              <option value="descendantStrings">Descendant #string</option>
              <option value="descendantNumbers">Descendant %number</option>
              <option value="namePattern">Name pattern</option>
            </optgroup>
            <optgroup label="Attributes">
              <option value="itemAttributes">Item attributes</option>
              <option value="fieldAttributes">Field attributes</option>
            </optgroup>
            <optgroup label="Predicates">
              <option value="skuFilter">SKU contains B</option>
              <option value="adminRoles">Any admin role</option>
              <option value="emptyRoles">Empty roles</option>
              <option value="numericIdGuard">Numeric id guard</option>
              <option value="nullReason">Null reason</option>
              <option value="numericSpecials">NaN or infinity</option>
            </optgroup>
            <optgroup label="Pipeline">
              <option value="inactiveOrder">Inactive ordered by quantity</option>
              <option value="parseProjection">Projection parse check</option>
            </optgroup>
          </select>
          <button id="resetButton" type="button">Reset</button>
          <button id="parseButton" type="button">Parse</button>
          <button id="runButton" type="button">Run</button>
        </div>
      </header>

      <section class="workspace" aria-label="SANSA Query workspace">
        <section class="panel source-panel">
          <div class="panel-head">
            <label id="sourceLabel" for="fixtureInput">AEON Source</label>
            <span id="fixtureStatus">default aeon</span>
          </div>
          <div class="source-mode-row">
            <label>
              <input type="radio" name="sourceKind" value="aeon" checked>
              AEON
            </label>
            <label>
              <input type="radio" name="sourceKind" value="json">
              JSON fixture
            </label>
          </div>
          <textarea id="fixtureInput" spellcheck="false"></textarea>
        </section>

        <section class="panel query-panel">
          <div class="panel-head">
            <label for="queryInput">Query</label>
            <span id="queryStatus">ready</span>
          </div>
          <textarea id="queryInput" spellcheck="false"></textarea>

          <div class="mode-row" role="group" aria-label="Result format">
            <label>
              <input type="radio" name="outputMode" value="text" checked>
              Text
            </label>
            <label>
              <input type="radio" name="outputMode" value="json">
              JSON
            </label>
          </div>

          <div class="panel-head results-head">
            <label for="resultOutput">Results</label>
            <span id="resultStatus">0 results</span>
          </div>
          <pre id="resultOutput" tabindex="0"></pre>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
