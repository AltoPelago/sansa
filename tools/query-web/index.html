<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SANSA Query Workbench</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>SANSA Query Workbench</h1>
        </div>
        <div class="topbar-actions">
          <select id="exampleSelect" aria-label="Example query"></select>
          <button id="resetButton" type="button">Reset</button>
          <button id="parseButton" type="button">Parse</button>
          <button id="runButton" type="button">Run</button>
        </div>
      </header>

      <section class="workspace" aria-label="SANSA Query workspace">
        <section class="panel source-panel">
          <div class="panel-head">
            <label id="sourceLabel" for="fixtureInput">AEON Source</label>
            <span id="fixtureStatus">default aeon</span>
          </div>
          <div class="source-mode-row">
            <label>
              <input type="radio" name="sourceKind" value="aeon" checked>
              AEON
            </label>
            <label>
              <input type="radio" name="sourceKind" value="telex">
              Telex AES
            </label>
            <label>
              <input type="radio" name="sourceKind" value="json">
              JSON fixture
            </label>
          </div>
          <textarea id="fixtureInput" spellcheck="false"></textarea>
          <div class="panel-head params-head">
            <label for="paramsInput">Params Local Space</label>
            <span id="paramsStatus">default params</span>
          </div>
          <textarea id="paramsInput" spellcheck="false"></textarea>
        </section>

        <section class="panel query-panel">
          <div class="panel-head">
            <label for="queryInput">Query</label>
            <span id="queryStatus">ready</span>
          </div>
          <textarea id="queryInput" spellcheck="false"></textarea>

          <div class="mode-row" role="group" aria-label="Result format">
            <label>
              <input type="radio" name="outputMode" value="text" checked>
              Text
            </label>
            <label>
              <input type="radio" name="outputMode" value="json">
              JSON
            </label>
            <label>
              <input type="radio" name="outputMode" value="inspect">
              Inspect
            </label>
          </div>

          <div class="mode-row" role="group" aria-label="Query policy">
            <label>
              <input type="radio" name="queryPolicy" value="" checked>
              Normal
            </label>
            <label>
              <input type="radio" name="queryPolicy" value="validation">
              Validation
            </label>
          </div>

          <div class="mode-row" role="group" aria-label="Experimental extensions">
            <label>
              <input type="checkbox" id="transformExtensions" checked>
              Transform
            </label>
          </div>

          <div class="mode-row" role="group" aria-label="Value semantics profile">
            <label for="valueSemantics">Value Semantics</label>
            <select id="valueSemantics">
              <option value="">Default</option>
              <option value="aeon.value.string.codepoint.v1">Codepoint</option>
              <option value="aeon.value.string.natural.ascii.v1">Natural ASCII</option>
              <option value="aeon.value.string.locale.fr.v1">French</option>
            </select>
          </div>

          <div class="budget-row" role="group" aria-label="Evaluation budgets">
            <label>
              From
              <input type="number" id="maxFromBindings" min="0" step="1" inputmode="numeric">
            </label>
            <label>
              Where
              <input type="number" id="maxWhereCandidates" min="0" step="1" inputmode="numeric">
            </label>
            <label>
              Order
              <input type="number" id="maxOrderCandidates" min="0" step="1" inputmode="numeric">
            </label>
            <label>
              Results
              <input type="number" id="maxResultRecords" min="0" step="1" inputmode="numeric">
            </label>
          </div>

          <div class="panel-head results-head">
            <label for="resultOutput">Results</label>
            <span id="resultStatus">0 results</span>
          </div>
          <pre id="resultOutput" tabindex="0"></pre>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
