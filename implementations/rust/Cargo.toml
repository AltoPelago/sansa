[workspace]
members = ["crates/sansa-runtime"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/AltoPelago/sansa"
rust-version = "1.93.1"
version = "0.13.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
