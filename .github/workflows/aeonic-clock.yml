name: Aeonic civil-clock operations

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-0-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/clock-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/clock-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 042b0e9c51680a95fda1dbba57bd8f014b3e628e
          path: clock-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: 29b3a0b52d9709a9937d9b48f23eefcab0e35aea
          path: clock-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r clock-cts/runners/requirements-aeonic-operations.txt
      - name: Validate civil-clock claims
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-clock-claims.json
      - name: Verify complete civil-clock snapshot 0.1
        run: |
          npm run cts:aeonic-clock
          npm run cts:aeonic-clock -- --capability-set relations
          npm run cts:aeonic-clock -- --capability-set arithmetic
      - name: Independent default-capacity checks
        run: npm run cts:aeonic-clock:capacity
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: API and ingress regressions
        run: npm test
      - name: TypeScript consumer contract
        run: |
          npm install --prefix "$RUNNER_TEMP/sansa-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node "$RUNNER_TEMP/sansa-types/node_modules/typescript/bin/tsc" --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext test/types/aeonic-clock.mts test/types/aeonic-datetime.mts test/types/aeonic-temporal.mts test/types/aeonic-rational-arithmetic.mts test/types/aeonic-arithmetic.mts
