name: Publish npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: npm install --package-lock=false --ignore-scripts --no-audit --fund=false

      - name: Validate release tag
        run: node -e 'const pkg = require("./package.json"); const expected = "v" + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Release tag " + process.env.GITHUB_REF_NAME + " does not match package version " + expected); process.exit(1); }'

      - name: Unit tests
        run: npm test

      - name: CTS
        run: npm run cts

      - name: Experimental Query CTS
        run: npm run cts:query:experimental

      - name: Stress tests
        run: npm run stress

      - name: Package dry-run
        run: npm pack --dry-run --json

      - name: Publish
        run: npm publish --access public
