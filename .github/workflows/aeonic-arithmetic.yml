name: Aeonic arithmetic

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-0-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/arithmetic-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/arithmetic-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 321022560b477f238c69d3853c89d3aa135def2a
          path: arithmetic-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: be4597cba2909d9756297047ec5bf34ec6cf8eea
          path: arithmetic-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r arithmetic-cts/runners/requirements-aeonic-operations.txt
      - name: Validate arithmetic claim
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-arithmetic-claims.json
      - name: Verify complete exact arithmetic snapshot 0.1
        run: npm run cts:aeonic-arithmetic
      - name: API and ingress regressions
        run: npm test
      - name: TypeScript consumer contract
        run: |
          npm install --prefix "$RUNNER_TEMP/sansa-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node "$RUNNER_TEMP/sansa-types/node_modules/typescript/bin/tsc" --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext test/types/aeonic-arithmetic.mts
