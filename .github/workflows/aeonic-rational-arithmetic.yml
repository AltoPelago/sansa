name: Aeonic rational arithmetic

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-0-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/rational-arithmetic-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/rational-arithmetic-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 2ee51c88ad944a0f1c0951d5e39b298561c00c35
          path: rational-arithmetic-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: d4801c7e4814af1ef6e51951c0af3f3d429f04fb
          path: rational-arithmetic-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r rational-arithmetic-cts/runners/requirements-aeonic-operations.txt
      - name: Validate rational arithmetic claim
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-rational-arithmetic-claims.json
      - name: Verify complete rational arithmetic snapshot 0.2
        run: npm run cts:aeonic-rational-arithmetic
      - name: Independent default-capacity checks
        run: npm run cts:aeonic-rational-arithmetic:capacity
      - name: API and ingress regressions
        run: npm test
      - name: TypeScript consumer contract
        run: |
          npm install --prefix "$RUNNER_TEMP/sansa-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node "$RUNNER_TEMP/sansa-types/node_modules/typescript/bin/tsc" --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext test/types/aeonic-rational-arithmetic.mts test/types/aeonic-arithmetic.mts
