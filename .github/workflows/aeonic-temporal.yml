name: Aeonic civil-date operations

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-0-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/temporal-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/temporal-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: ff3308837c3848b1596e76f0c997f8565edc2a45
          path: temporal-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: d0e89eb3b092bde56c04b1a5c9836373f5e8748e
          path: temporal-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r temporal-cts/runners/requirements-aeonic-operations.txt
      - name: Validate civil-date claims
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-temporal-claims.json
      - name: Verify complete civil-date snapshot 0.1
        run: |
          npm run cts:aeonic-temporal
          npm run cts:aeonic-temporal -- --capability-set relations
          npm run cts:aeonic-temporal -- --capability-set calendar
      - name: Independent default-capacity checks
        run: npm run cts:aeonic-temporal:capacity
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: API and ingress regressions
        run: npm test
      - name: TypeScript consumer contract
        run: |
          npm install --prefix "$RUNNER_TEMP/sansa-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node "$RUNNER_TEMP/sansa-types/node_modules/typescript/bin/tsc" --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext test/types/aeonic-temporal.mts test/types/aeonic-rational-arithmetic.mts test/types/aeonic-arithmetic.mts
