name: Aeonic civil-date-time operations

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-0-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/datetime-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/datetime-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 7b1e229a08d86ab6fcc91e1724a4252339849e70
          path: datetime-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: 75b8dbd33ead7f5f9a90714981d80529a72ec339
          path: datetime-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r datetime-cts/runners/requirements-aeonic-operations.txt
      - name: Validate civil-date-time claims
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-datetime-claims.json
      - name: Verify complete civil-date-time snapshot 0.1
        run: |
          npm run cts:aeonic-datetime
          npm run cts:aeonic-datetime -- --capability-set relations
          npm run cts:aeonic-datetime -- --capability-set arithmetic
      - name: Independent default-capacity checks
        run: npm run cts:aeonic-datetime:capacity
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: API and ingress regressions
        run: npm test
      - name: TypeScript consumer contract
        run: |
          npm install --prefix "$RUNNER_TEMP/sansa-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node "$RUNNER_TEMP/sansa-types/node_modules/typescript/bin/tsc" --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext test/types/aeonic-datetime.mts test/types/aeonic-temporal.mts test/types/aeonic-rational-arithmetic.mts test/types/aeonic-arithmetic.mts
