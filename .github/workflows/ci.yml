name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 0266d996a2b3a362e51eb6e850c0bfe2a9a32ee1
          path: aeonite-cts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust runtime and stable CTS lanes
        run: npm run test:rust

      - name: Rust package dry-run
        run: cargo package --locked --manifest-path implementations/rust/crates/sansa-runtime/Cargo.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 0266d996a2b3a362e51eb6e850c0bfe2a9a32ee1
          path: aeonite-cts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --package-lock=false --ignore-scripts --no-audit --fund=false

      - name: Version consistency
        run: npm run version:check

      - name: Unit tests
        run: npm test

      - name: CTS claim validation
        run: npm run validate:cts-claims

      - name: CTS
        run: npm run cts

      - name: Experimental Query CTS
        run: npm run cts:query:experimental

      - name: Next AEON value-alignment CTS
        run: |
          node scripts/cts-query.mjs --cts "${AEONITE_CTS_ROOT}/sansa/v1/sansa-query-parser-cts.v1.next.json"
          node scripts/cts-mutate.mjs --cts "${AEONITE_CTS_ROOT}/sansa/v1/sansa-mutate-cts.v1.next.json"

      - name: Stress tests
        run: npm run stress

      - name: Package dry-run
        run: npm pack --dry-run --json
