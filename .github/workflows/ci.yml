name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --package-lock=false --ignore-scripts --no-audit --fund=false

      - name: Unit tests
        run: npm test

      - name: CTS
        run: npm run cts

      - name: Experimental Query CTS
        run: npm run cts:query:experimental

      - name: Stress tests
        run: npm run stress

      - name: Package dry-run
        run: npm pack --dry-run --json
