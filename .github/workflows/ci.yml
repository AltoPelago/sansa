name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 64a4034c7077d94eedcfe1f12e8e43be1e18249c
          path: aeonite-cts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust runtime and stable CTS lanes
        run: npm run test:rust

      - name: Rust package dry-run
        run: cargo package --locked --manifest-path implementations/rust/crates/sansa-runtime/Cargo.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --package-lock=false --ignore-scripts --no-audit --fund=false

      - name: Version consistency
        run: npm run version:check

      - name: Unit tests
        run: npm test

      - name: CTS claim validation
        run: npm run validate:cts-claims

      - name: CTS
        run: npm run cts

      - name: Experimental Query CTS
        run: npm run cts:query:experimental

      - name: Stress tests
        run: npm run stress

      - name: Package dry-run
        run: npm pack --dry-run --json
