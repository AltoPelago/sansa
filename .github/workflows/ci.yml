name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout aeonite-cts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --package-lock=false --ignore-scripts --no-audit --fund=false

      - name: Unit tests
        run: npm test

      - name: CTS
        run: npm run cts

      - name: Experimental Query CTS
        run: npm run cts:query:experimental

      - name: Stress tests
        run: npm run stress

      - name: Package dry-run
        run: npm pack --dry-run --json
