name: Aeonic comparison

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/comparison-cts/cts
      AEONITE_SPECS_ROOT: ${{ github.workspace }}/comparison-specs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 127c6abe047ef74f54d2c966d191c6f744b13f91
          path: comparison-cts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-specs
          ref: 8322fecd90d941bf1a5eced2d983b8354e0aa1f9
          path: comparison-specs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install shared runner dependencies
        run: python3 -m pip install -r comparison-cts/runners/requirements-aeonic-operations.txt
      - name: Validate comparison claim
        run: node scripts/validate-cts-claims.mjs --claims conformance/aeonic-comparison-claims.json
      - name: Verify baseline against frozen snapshot 0.1
        run: npm run cts:aeonic-comparison
